name: research-stocks
# Nightly: daily stock history (Nifty 500 for research; every investable NSE cash stock for the market view),
# the stock-pick scan, and the market view + chart series. Big daily-churn files go to the single-commit
# `stock-data` branch (force-pushed) so the repository history stays small.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 14 * * 1-5"   # 19:45 IST
    - cron: "30 0 * * 2-6"    # 06:00 IST next morning - Yahoo sometimes posts the NSE session late; picks are re-done before the 09:45 push
permissions:
  contents: write
concurrency:
  group: research-stocks
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests numpy
      - run: mkdir -p research/work research/work/out
      - run: python research/fetch_stocks.py 2>&1 | tee -a research/work/run.log
      - run: python research/stock_scan.py 2>&1 | tee -a research/work/run.log
      - run: python research/stock_market.py 2>&1 | tee -a research/work/run.log
      - name: keep the log when a step fails
        if: failure()
        run: |
          git config user.name "fno-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "run $(date -u +%FT%TZ) sha ${{ github.sha }}"; tail -80 research/work/run.log 2>/dev/null || echo "(no run.log)"; } > research/data/stocks_run_log.txt
          git add research/data/stocks_run_log.txt && git commit -m "stocks job failed $(date -u +%F) - log [skip ci]" || true
          git pull --rebase -q origin research-data || true
          git push origin HEAD:research-data || true
      - name: commit research data
        run: |
          git config user.name "fno-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/stocks_1d.csv.gz research/data/stocks_list.csv research/data/stock_picks.json research/data/stock_analyst.json
          git commit -m "stock daily data [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin research-data || true
          git push origin HEAD:research-data
      - name: publish market view to the stock-data branch
        run: |
          set -e
          D=$(mktemp -d)
          cp research/work/out/stock_market.json research/work/out/stock_series.json research/data/stock_picks.json "$D"/
          cd "$D"
          git init -q -b stock-data
          git config user.name "fno-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "stock market view $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stock-data
