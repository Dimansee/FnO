name: global-tick
# Backup only: the app now runs the crypto and US books itself every minute on Render (fno/runner.py) plus a QStash call every 10 min. GitHub runs this far less often than every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/tick/global
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://fno-trainer.onrender.com' }}
        run: |
          curl -sS -m 100 --retry 2 -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/tick/global"
