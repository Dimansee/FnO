name: global-tick
# Runs the crypto and US paper books every 5 minutes (QStash's free quota is used up by the Indian minute tick).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/tick/global
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -m 100 --retry 2 -X POST -H "x-cron-secret: $CRON_SECRET" https://fno-trainer.vercel.app/api/tick/global
