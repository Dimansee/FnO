name: research-1m
on:
  push:
    branches: [research-data]
    paths: ["research/fetch_1m.py", ".github/workflows/research-1m.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python research/fetch_1m.py
      - name: commit data
        if: always()
        run: |
          git config user.name "fno-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data research/fetch_1m_log.txt || true
          git commit -m "1-minute index data [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin research-data || true
          git push origin HEAD:research-data
