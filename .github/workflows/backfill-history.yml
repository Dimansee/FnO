name: backfill-history
# One-off / on-demand: NSE participant-wise OI history and long US/Asia daily prices for research (round 76).
# Writes research/data/participant_oi_hist.csv.gz and research/data/global_long_1d.csv.gz on the research-data branch.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD)"
        required: false
        default: "2022-12-01"
permissions:
  contents: write
concurrency:
  group: backfill-history
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-data
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance
      - run: python app/research/fetch_backfill.py research/data ${{ github.event.inputs.start }}
      - name: commit data
        run: |
          git config user.name "fno-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/participant_oi_hist.csv.gz research/data/global_long_1d.csv.gz || true
          git commit -m "participant OI + global daily history $(date -u +%F) [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin research-data || true
          git push origin HEAD:research-data
